name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pytest
      - name: Run the tests
        run: python3 -m pytest -q -p no:cacheprovider
